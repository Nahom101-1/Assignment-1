# Run with:  docker compose up --build

# Shared proxy connection settings
x-proxy-env: &proxy-env
  PROXY_HOST: proxy
  PROXY_PORT: "1099"

# Shared settings for all servers
x-server-common: &server-common
  image: ass1-solution
  command: ["server"]
  depends_on:
    - proxy
  restart: on-failure

services:
  proxy:
    build: .
    image: ass1-solution
    command: ["proxy"]
    environment:
      HOST: proxy
      PORT: "1099"
    ports:
      - "1099:1099"
    restart: unless-stopped

  server1:
      <<: *server-common
      environment:
        <<: *proxy-env
        SERVER_HOST: server1
        SERVER_PORT: "1101"
        SERVER_ZONE: "1"

  server2:
      <<: *server-common
      environment:
        <<: *proxy-env
        SERVER_HOST: server2
        SERVER_PORT: "1102"
        SERVER_ZONE: "2"

  server3:
      <<: *server-common
      environment:
        <<: *proxy-env
        SERVER_HOST: server3
        SERVER_PORT: "1103"
        SERVER_ZONE: "3"

  server4:
      <<: *server-common
      environment:
        <<: *proxy-env
        SERVER_HOST: server4
        SERVER_PORT: "1104"
        SERVER_ZONE: "4"

  server5:
      <<: *server-common
      environment:
        <<: *proxy-env
        SERVER_HOST: server5
        SERVER_PORT: "1105"
        SERVER_ZONE: "5"
  client:
    image: ass1-solution
    command: [ "client" ]
    environment:
      <<: *proxy-env
    depends_on:
      - server1
      - server2
      - server3
      - server4
      - server5
    restart: on-failure

