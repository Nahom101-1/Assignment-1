# docker compose up --build -d     start the proxy and the five servers
# docker compose run client        run one measurement
#
# Containers reach each other by service name, so each one advertises its own
# name.
# SERVER_CACHE / CLIENT_CACHE select the cache for a run, T the interval.
#
# ./data is mounted, so the queue logs and the output file stay on the host.

x-app: &app
  build: .
  image: ass1-solution
  restart: on-failure
  volumes:
    - ./data:/app/data

services:
  proxy:
    <<: *app
    command: ["proxy", "--host", "proxy"]
    ports:
      - "1099:1099"
    restart: unless-stopped

  server1:
    <<: *app
    depends_on:
      - proxy
    command: ["server", "--server-host", "server1", "--server-port", "1101", "--zone", "1",
              "--proxy-host", "proxy", "--cache", "${SERVER_CACHE:-none}"]

  server2:
    <<: *app
    depends_on:
      - proxy
    command: ["server", "--server-host", "server2", "--server-port", "1102", "--zone", "2",
              "--proxy-host", "proxy", "--cache", "${SERVER_CACHE:-none}"]

  server3:
    <<: *app
    depends_on:
      - proxy
    command: ["server", "--server-host", "server3", "--server-port", "1103", "--zone", "3",
              "--proxy-host", "proxy", "--cache", "${SERVER_CACHE:-none}"]

  server4:
    <<: *app
    depends_on:
      - proxy
    command: ["server", "--server-host", "server4", "--server-port", "1104", "--zone", "4",
              "--proxy-host", "proxy", "--cache", "${SERVER_CACHE:-none}"]

  server5:
    <<: *app
    depends_on:
      - proxy
    command: ["server", "--server-host", "server5", "--server-port", "1105", "--zone", "5",
              "--proxy-host", "proxy", "--cache", "${SERVER_CACHE:-none}"]

  client:
    <<: *app
    working_dir: /app/data
    entrypoint: ["java", "-jar", "/app/solution.jar"]
    command: ["client", "--proxy-host", "proxy", "--input", "exercise_1_input.txt",
              "--interval", "${T:-50}",
              "--cache", "${CLIENT_CACHE:-off}",
              "--server-cache", "${SERVER_CACHE_ENABLED:-false}"]
    depends_on:
      - server1
      - server2
      - server3
      - server4
      - server5
